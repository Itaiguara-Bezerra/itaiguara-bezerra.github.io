<style>
        /* Container dos Dois Cards do Lado Direito */
        .chart-grid-container {
            width: 50%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            z-index: 2;
        }

        .showcase-card {
            background-color: rgba(11, 15, 18, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 14px;
            text-decoration: none;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .showcase-card:hover {
            border-color: #c5a880;
            transform: translateY(-3px);
            box-shadow: 0px 12px 35px rgba(197, 168, 128, 0.25);
        }

        .card-tag {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            align-self: flex-start;
        }

        .tag-lab {
            color: #c5a880;
            background: rgba(197, 168, 128, 0.15);
            border: 1px solid rgba(197, 168, 128, 0.3);
        }

        .tag-projects {
            color: #4a6175;
            background: rgba(74, 97, 117, 0.2);
            border: 1px solid rgba(74, 97, 117, 0.4);
        }

        /* Padronização Rígida de Proporção das Imagens (16:9) */
        .card-image-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 4px;
            margin-bottom: 12px;
            background: #080c0e;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Garante preenchimento simétrico idêntico nas duas áreas */
            opacity: 0.85;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .showcase-card:hover .card-image-wrapper img {
            opacity: 1;
            transform: scale(1.03);
        }

        .card-label-title {
            color: #e0e0e0;
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-align: center;
            padding-top: 4px;
        }

        @media (max-width: 1100px) {
            .chart-grid-container {
                width: 100%;
                max-width: 600px;
            }
        }

        @media (max-width: 600px) {
            .chart-grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
