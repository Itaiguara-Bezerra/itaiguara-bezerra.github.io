<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itaiguara Bezerra | Senior Economist & Data Economist</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b151e;
            overflow-x: hidden;
        }

        /* Container da Landing Page com a imagem de fundo cheia */
        .hero-viewport {
            width: 100%;
            height: 100vh;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 8%;
        }

        /* Menu Superior de Navegação Dinâmica */
        nav {
            position: absolute;
            top: 40px;
            right: 8%;
            display: flex;
            gap: 15px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }

        nav a:hover {
            opacity: 1;
        }

        nav span {
            color: #ffffff;
            opacity: 0.4;
        }

        /* Bloco de Conteúdo Principal (Alinhado à Esquerda) */
        .content-block {
            max-width: 650px;
            color: #ffffff;
            z-index: 2;
        }

        .content-block h1 {
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.1;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }

        .content-block h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #d1d5db;
            letter-spacing: 1px;
            margin-bottom: 35px;
            text-transform: uppercase;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
        }

        /* Botões Estilo Metálico/Glow */
        .btn-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-detailed {
            display: inline-block;
            padding: 14px 28px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #1d2d44 0%, #0f172a 100%);
            border: 2px solid #475569;
            border-radius: 4px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-detailed:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            nav {
                top: 20px;
                right: 5%;
                font-size: 0.8rem;
                gap: 8px;
            }
            .hero-viewport {
                padding: 0 5%;
            }
            .content-block h1 {
                font-size: 2.5rem;
            }
            .content-block h2 {
                font-size: 1.1rem;
                margin-bottom: 25px;
            }
            .btn-group {
                flex-direction: column;
                width: 100%;
            }
            .btn-detailed {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="hero-viewport">
        <nav>
            <a href="index.html">HOME</a> <span>|</span>
            <a href="resume.html">ABOUT</a> <span>|</span>
            <a href="#">PROJECTS</a> <span>|</span>
            <a href="resume.html">RESUME</a> <span>|</span>
            <a href="#">CONTACT</a>
        </nav>

        <div class="content-block">
            <h1>Itaiguara Bezerra</h1>
            <h2>Senior Economist | Data Economist</h2>
            
            <div class="btn-group">
                <a href="curriculo_estendido_pt.pdf" target="_blank" class="btn-detailed">Download Portuguese Version</a>
                <a href="resume_full_en.pdf" target="_blank" class="btn-detailed">Download English Version</a>
            </div>
        </div>
    </div>

</body>
</html>
