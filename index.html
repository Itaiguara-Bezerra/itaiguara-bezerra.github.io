<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itaiguara Bezerra | Senior Economist</title>
    
    <style>
        html, body, nav, main, h1, p, a, div, img {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0c; /* Fundo preto escuro puro e sólido, sem grades */
            font-family: 'Times New Roman', Times, serif;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* BARRA DE NAVEGAÇÃO LIMPA */
        .navbar {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
            background-color: transparent;
        }
        .navbar a {
            color: #a0aec0;
            text-decoration: none;
            margin-left: 30px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        .navbar a:hover {
            color: #3182ce;
        }

        /* CAPA ALINHADA (HORIZONTAL) */
        .capa-conteudo {
            flex: 1;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 40px;
            gap: 60px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* EMBUTIMENTO FORÇADO DA LOGO CORRETA */
        .logo-real {
            width: 240px; /* Mantém a proporção exata e firme */
            height: auto;
            object-fit: contain;
            display: block;
            
            /* Força a imagem a ignorar a barreira do fundo cinza claro */
            mix-blend-mode: screen; 
            filter: grayscale(1) invert(0) brightness(1.2) contrast(1.2);
        }

        /* CAIXA DE TEXTO */
        .texto-capa {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        /* TÍTULOS E SUBTÍTULOS */
        h1 {
            font-size: 38px;
            font-weight: 400;
            letter-spacing: 4px;
            margin: 0 0 15px 0;
            text-transform: uppercase;
        }

        p {
            font-size: 16px;
            color: #cbd5e0;
            letter-spacing: 2px;
            max-width: 550px;
            margin: 0 0 40px 0;
            text-transform: uppercase;
            line-height: 1.6;
        }

        /* BOTÃO */
        .botao-portfolio {
            border: 1px solid #3182ce;
            padding: 12px 28px;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .botao-portfolio:hover {
            background-color: rgba(49, 130, 206, 0.1);
            box-shadow: 0 0 15px rgba(49, 130, 206, 0.3);
        }

        /* RESPONSIVIDADE */
        @media (max-width: 768px) {
            .capa-conteudo {
                flex-direction: column;
                gap: 30px;
                padding: 20px;
            }
            .texto-capa {
                align-items: center;
                text-align: center;
            }
            .logo-real {
                width: 180px;
            }
            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#resume">Resume</a>
        <a href="#contact">Contact</a>
    </nav>

    <main class="capa-conteudo">
        
        <img src="logo.jfif" alt="Itaiguara Bezerra Crest" class="logo-real">
        
        <div class="texto-capa">
            <h1>Senior Economist | Data Economist</h1>
            <p>Synthesizing Economic Theory, Econometrics, and Data Science</p>
            <a href="#projects" class="botao-portfolio">View Selected Portfolio</a>
        </div>

    </main>

</body>
</html>
