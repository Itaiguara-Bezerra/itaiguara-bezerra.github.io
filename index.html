<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itaiguara Bezerra | Senior Economist & Data Economist</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b151e;
            overflow-x: hidden;
        }

        /* Container da Landing Page com a imagem de fundo cheia */
        .hero-viewport {
            width: 100%;
            height: 100vh;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 8%;
        }

        /* Menu Superior de Navegação Dinâmica */
        nav {
            position: absolute;
            top: 40px;
            right: 8%;
            display: flex;
            gap: 15px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 10;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s ease;
        }

        nav a:hover {
            opacity: 1;
        }

        nav span {
            color: #ffffff;
            opacity: 0.4;
        }

        /* Bloco de Conteúdo Principal (Alinhado à Esquerda) */
        .content-block {
            max-width: 750px;
            color: #ffffff;
            z-index: 2;
        }

        .content-block h1 {
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.1;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }

        .content-block h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #d1d5db;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
        }

        @media (max-width: 768px) {
            nav {
                top: 20px;
                right: 5%;
                font-size: 0.8rem;
                gap: 8px;
            }
            .hero-viewport {
                padding: 0 5%;
            }
            .content-block h1 {
                font-size: 2.5rem;
            }
            .content-block h2 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="hero-viewport">
        <nav>
            <a href="index.html">HOME</a> <span>|</span>
            <a href="resume.html" target="_blank">ABOUT</a> <span>|</span>
            <a href="projects.html" target="_blank">PROJECTS</a> <span>|</span>
            <a href="resume.html" target="_blank">RESUME</a> <span>|</span>
            <a href="#">CONTACT</a>
        </nav>

        <div class="content-block">
            <h1>Itaiguara Bezerra</h1>
            <h2>Senior Economist | Data Economist</h2>
        </div>
    </div>

</body>
</html>
