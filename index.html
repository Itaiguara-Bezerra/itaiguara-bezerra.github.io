<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itaiguara Bezerra | Senior Economist</title>
    
    <style>
        /* 1. BLINDAGEM CONTRA O BUG DE TEXTO (Substituindo o seletor universal) */
        html, body, nav, main, h1, p, a, div {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0c; /* Fundo escuro premium */
            font-family: 'Times New Roman', Times, serif; /* Estética clássica */
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 2. BARRA DE NAVEGAÇÃO LIMPA */
        .navbar {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
            background-color: transparent;
        }
        .navbar a {
            color: #a0aec0;
            text-decoration: none;
            margin-left: 30px;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        .navbar a:hover {
            color: #3182ce; /* Toque de azul no foco */
        }

        /* 3. CAPA CENTRALIZADA */
        .capa-conteudo {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* MARCADOR DO BRASÃO (CSS Puro para evitar imagem quebrada) */
        .logo-provisoria {
            width: 180px;
            height: 180px;
            margin-bottom: 30px;
            background: radial-gradient(circle, #1a202c 0%, #0a0a0c 100%);
            border-radius: 50%;
            border: 1px solid #2d3748;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a5568;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* TÍTULOS E SUBTÍTULOS DE ELITE */
        h1 {
            font-size: 36px;
            font-weight: 400;
            letter-spacing: 4px;
            margin: 0 0 15px 0;
            text-transform: uppercase;
        }

        p {
            font-size: 16px;
            color: #cbd5e0;
            letter-spacing: 2px;
            max-width: 600px;
            margin: 0 0 40px 0;
            text-transform: uppercase;
        }

        /* BOTÃO CONVEXO */
        .botao-portfolio {
            border: 1px solid #3182ce;
            padding: 12px 28px;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .botao-portfolio:hover {
            background-color: rgba(49, 130, 206, 0.1);
            box-shadow: 0 0 15px rgba(49, 130, 206, 0.3);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#resume">Resume</a>
        <a href="#contact">Contact</a>
    </nav>

    <main class="capa-conteudo">
        <div class="logo-provisoria">Heraldic Crest</div>
        
        <h1>Senior Economist | Data Economist</h1>
        
        <p>Synthesizing Economic Theory, Econometrics, and Data Science</p>
        
        <a href="#projects" class="botao-portfolio">View Selected Portfolio</a>
    </main>

</body>
</html>
