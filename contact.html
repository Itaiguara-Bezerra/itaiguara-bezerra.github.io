        .navbar-resume {
            position: relative;
            padding: 30px 8% 0 0;
            text-align: right;
            z-index: 100;
        }

        .navbar-resume a {
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-left: 25px;
            transition: color 0.3s ease;
        }

        .navbar-resume a:hover, .navbar-resume a.active {
            color: #c5a880;
        }

        .navbar-resume span {
            color: #ffffff;
            opacity: 0.3;
            margin-left: 25px;
        }

        .resume-container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 40px 20px 100px 20px;
        }

        /* Discrete Back Button */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #b3b3b3;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 30px;
            transition: color 0.2s ease;
        }

        .btn-back:hover {
            color: #c5a880;
        }

        .cabecalho-curriculo {
            border-bottom: 2px solid #c5a880;
            padding-bottom: 20px;
            margin-bottom: 50px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .contact-card {
            background-color: #0b0f12;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 40px 30px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .contact-card:hover {
            border-color: #c5a880;
            background-color: #11161b;
        }

        .contact-card h3 {
            font-size: 1.1rem;
            color: #c5a880;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .contact-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.2s ease;
            display: inline-block;
            word-break: break-all;
        }

        .contact-link:hover {
            color: #c5a880;
        }
